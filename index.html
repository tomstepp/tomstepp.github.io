<!DOCTYPE html>

<body>
   <!-- Navigation Bar -->
   <nav>
      <a href="TomStepp_Resume.pdf" class="resume-link">Gmail</a>

      <button onclick="openResume()">Sign In</button>

   <!-- Main Content -->
   <section class="section-1">
      <!-- Name in Google styling -->
      <p class="google-word">
         <span class="google-letter google-blue">T</span>
         <span class="google-letter google-red">o</span>
         <span class="google-letter google-yellow">m</span>
         <span class="google-letter">&nbsp;</span>
         <span class="google-letter google-blue">S</span>
         <span class="google-letter google-green">t</span>
         <span class="google-letter google-red">e</span>
         <span class="google-letter google-blue">p</span>
         <span class="google-letter google-red">p</span>
      </p>
      <!-- Search Form -->
      <form onsubmit="openResume(); return false;">
         <br><br>
         <div class="s-box">
            <img onclick="openResume()" src="img/search.svg" class="search-icon">
            <input onclick="stopTypewriter()" id="textbox" type="text" class="s-input">
            <img onclick="openResume()" src="img/mic.png" class="mic-icon">
            <input type="submit" class="s-btn" value="Google Search">
            <input type="submit" class="s-btn" value="I'm Feeling Lucky">
         </div>
      </form>
      <!-- Note below search -->
      <div class="lang">

      </div>
   </section>
   <!-- Footer -->
   <footer>
      <div class="links">
         <div class="link-1">
            <a href="TomStepp_Resume.pdf" class="resume-link">About</a>
         </div>
         <div class="link-2">
